server.port=8080
spring.application.name=ai-rag-backend

# Replace with your actual API key
# Alibaba Cloud Bailian (DashScope) Configuration
# Default dummy key to allow startup. Real key provided by user in frontend.
openai.api.key=sk-dummy-key-for-startup
openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
openai.model-name=qwen-plus

# OpenAI Configuration (Alternative)
# openai.api.key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxx
# openai.base-url=https://api.openai.com/v1
# openai.model-name=gpt-3.5-turbo

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ai_rag?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
